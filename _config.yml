baseurl: "" # the subpath of your site, e.g. /blog
url: "https://navars.xyz" # the base hostname & protocol for your site, e.g. http://example.com
github_username:  navarrs

collections:
  publications:
    output: true

# Build settings
theme: bulma-clean-theme
plugins:
  - jekyll-feed

favicon: assets/img/paper-plane.png
show_sidebar: false
hide_footer: true

exclude:
  - bin/ # local dev scripts, not part of the site
  - README.md
  - LOCAL-DEV.md # private notes; gitignored, never publish even in a local build
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/bootstrap/
#   - vendor/gems/
#   - vendor/ruby/
